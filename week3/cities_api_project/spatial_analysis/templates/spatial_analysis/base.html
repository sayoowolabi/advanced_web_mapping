<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}Dublin Spatial Analysis{% endblock title %}</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		:root {
			--dublin-ink: #172326;
			--dublin-green: #226b5e;
			--dublin-paper: #f4f1ea;
		}

		body {
			min-height: 100vh;
			color: var(--dublin-ink);
			background: var(--dublin-paper);
		}

		.site-header {
			background: var(--dublin-ink);
		}

		.site-brand {
			color: #fff;
			letter-spacing: .08em;
			text-transform: uppercase;
		}

		.site-brand:hover { color: #c5e2d8; }

		.site-nav-link {
			color: rgba(255, 255, 255, .75);
			text-decoration: none;
		}

		.site-nav-link:hover { color: #fff; }

		.btn-primary {
			--bs-btn-bg: var(--dublin-green);
			--bs-btn-border-color: var(--dublin-green);
			--bs-btn-hover-bg: #185347;
			--bs-btn-hover-border-color: #185347;
		}

		.site-footer {
			color: #667477;
			font-size: .85rem;
		}
	</style>
	{% block extra_css %}{% endblock extra_css %}
</head>
<body>
	<header class="site-header">
		<nav class="container d-flex flex-wrap align-items-center justify-content-between gap-3 py-3" aria-label="Main navigation">
			<a class="site-brand fw-bold text-decoration-none" href="{% url 'spatial_analysis:dashboard' %}">
				Dublin Spatial Analysis
			</a>
			<div class="d-flex gap-3">
				<a class="site-nav-link" href="{% url 'spatial_analysis:dashboard' %}">Dashboard</a>
				<a class="site-nav-link" href="/admin/">Admin</a>
			</div>
		</nav>
	</header>

	<main>{% block content %}{% endblock content %}</main>

	<footer class="site-footer container py-4">
		Dublin geographic data and spatial analysis
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	{% block extra_js %}{% endblock extra_js %}
</body>
</html>
